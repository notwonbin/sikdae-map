<style>
:root{
  --blue:#3182F6; --blue-hover:#1B64DA; --blue-press:#1957C2;
  --g900:#191F28; --g800:#333D4B; --g700:#4E5968; --g600:#6B7684; --g500:#8B95A1;
  --g400:#B0B8C1; --g300:#D1D6DB; --g200:#E5E8EB; --g100:#F2F4F6; --g50:#F9FAFB;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:#fff;color:var(--g900);-webkit-font-smoothing:antialiased;letter-spacing:-0.02em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}

.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* header */
header{padding:44px 0 18px}
.seg{display:inline-flex;background:var(--g100);border-radius:12px;padding:4px;gap:2px}
.seg button{height:36px;padding:0 16px;white-space:nowrap;border-radius:9px;font-size:15px;font-weight:600;color:var(--g600);transition:background .15s,color .15s,box-shadow .15s}
.seg button span{font-weight:500;color:var(--g400);margin-left:4px;font-size:14px}
.seg button.on{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on span{color:var(--g500)}
h1{font-size:28px;line-height:1.36;font-weight:700;color:var(--g900)}
.sub{font-size:15px;color:var(--g600);margin-top:6px}

/* sticky controls */
.bar{position:sticky;top:0;z-index:20;background:#fff;padding:12px 0 0}
.bar .seg{margin-bottom:10px}
.bar.stuck{box-shadow:0 1px 0 var(--g100)}
.row{display:flex;gap:8px}
.search{flex:1;position:relative;display:block}
.search svg.i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--g400)}
.search input{width:100%;height:48px;border:0;border-radius:14px;background:var(--g100);
  padding:0 44px 0 46px;font:inherit;font-size:16px;font-weight:500;color:var(--g900);outline:none;transition:box-shadow .15s}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--g400);font-weight:500}
.search input:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;
  display:none;place-items:center;background:var(--g400);color:#fff}
.clear.on{display:grid}
.btn{height:48px;padding:0 18px;border-radius:14px;font-size:15px;font-weight:600;white-space:nowrap;transition:background .15s, transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hover)}
.btn-primary:active{background:var(--blue-press)}
.btn-weak{background:#E8F3FF;color:var(--blue)}
.btn-weak:hover{background:#D6E8FF}
.btn[hidden]{display:none}

.regions{display:flex;gap:20px;margin-top:16px;border-bottom:1px solid var(--g100);overflow-x:auto;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.region{flex:none;position:relative;height:40px;font-size:16px;font-weight:600;color:var(--g500);transition:color .15s}
.region span{font-size:14px;font-weight:500;margin-left:4px;color:var(--g400)}
.region:hover{color:var(--g700)}
.region.on{color:var(--g900)}
.region.on span{color:var(--g600)}
.region.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--g900);border-radius:1px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs[hidden],.regions[hidden]{display:none}
.tab{flex:none;height:34px;padding:0 13px;border-radius:17px;font-size:14px;font-weight:600;color:var(--g700);
  background:var(--g100);transition:background .15s,color .15s;display:inline-flex;align-items:center;gap:5px}
.tab span{font-weight:500;color:var(--g500);font-size:13px}
.tab:hover{background:var(--g200)}
.tab.on{background:var(--g900);color:#fff}
.tab.on span{color:var(--g400)}
.tab.zero{color:var(--g400)}

/* list header */
.meta{display:flex;justify-content:space-between;align-items:center;margin:18px 0 16px}
.count{font-size:17px;font-weight:700;color:var(--g900)}
.sort{display:flex;align-items:center;gap:12px}
.sort button{font-size:14px;font-weight:500;color:var(--g500)}
.sort button.on{color:var(--g900);font-weight:600}
.sort i{width:1px;height:10px;background:var(--g300)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 16px;padding-bottom:96px}
.card{display:block;min-width:0;width:100%;text-align:left;cursor:pointer;position:relative}
.fav{position:absolute;z-index:3;top:8px;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.fav:active{transform:scale(.85)}
.fav svg path{fill:rgba(0,0,0,.18);stroke:#fff;stroke-width:1.8;transition:fill .15s}
.fav.on svg path{fill:#F04452;stroke:#F04452}
.fav.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1.4)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.sheet .fav{top:14px;right:14px;width:40px;height:40px;background:rgba(0,0,0,.25);backdrop-filter:blur(6px)}
.sheet .fav svg path{fill:transparent}
.sheet .fav.on svg path{fill:#F04452}
.sheet{position:relative}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);z-index:60;background:rgba(25,31,40,.92);color:#fff;font-size:14px;font-weight:600;
  padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:16px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--g100);transition:transform .1s}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);z-index:2;pointer-events:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb img{transform:scale(1.03)}
.card:active .thumb{transform:scale(.98)}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--g400);background:var(--g100)}
.info{padding:12px 2px 0}
.name{font-size:16px;font-weight:600;line-height:1.4;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{font-size:14px;font-weight:500;color:var(--g500);margin-left:4px}
.desc{font-size:14px;line-height:1.45;color:var(--g600);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc b{font-weight:500;color:var(--g700)}
.desc i{display:inline-block;width:2px;height:2px;border-radius:50%;background:var(--g400);vertical-align:middle;margin:0 6px}
mark{background:var(--g200);color:var(--g900);border-radius:4px;padding:0 2px;margin:0 -1px}

.empty{grid-column:1/-1;text-align:center;padding:96px 0}
.empty h3{font-size:18px;font-weight:700;color:var(--g800)}
.empty p{font-size:15px;color:var(--g500);margin-top:6px}

footer{border-top:1px solid var(--g100);padding:28px 0 48px;font-size:13px;line-height:1.6;color:var(--g500)}

/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{width:min(400px,100%);background:#fff;border-radius:24px;overflow:hidden;transform:translateY(16px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.dim.on .sheet{transform:none}
.sheet .thumb{border-radius:0;aspect-ratio:16/10}
.sheet .thumb::after{display:none}
.sheet .body{padding:24px 24px 20px}
.sheet .label{font-size:14px;font-weight:600;color:var(--blue)}
.sheet h2{font-size:22px;font-weight:700;line-height:1.36;margin-top:6px}
.sheet .desc{white-space:normal;margin-top:6px}
.kv{margin-top:18px;border-top:1px solid var(--g100);padding-top:14px;display:grid;grid-template-columns:64px 1fr;row-gap:8px;font-size:14px;line-height:1.5}
.kv dt{color:var(--g500)}
.kv dd{color:var(--g800)}
.acts{display:flex;gap:8px;margin-top:22px}
.acts .btn{flex:1;min-width:0;height:54px;padding:0 10px;font-size:16px;border-radius:16px;display:grid;place-items:center}
.acts .btn-weak{flex:0 0 auto;padding:0 22px}

/* intro splash */
.intro{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;text-align:center;
  transition:opacity .35s ease, visibility .35s;cursor:pointer}
.intro.out{opacity:0;visibility:hidden}
.intro > div > *{opacity:0;transform:translateY(10px);animation:introIn .4s cubic-bezier(.2,.8,.2,1) forwards}
.intro .i1{font-size:15px;font-weight:600;color:var(--g500);animation-delay:.05s}
.intro .i2{font-size:34px;font-weight:800;letter-spacing:-0.04em;color:var(--g900);margin-top:8px;animation-delay:.12s}
.intro .i4{font-size:13px;font-weight:500;color:var(--g500);margin-top:18px;animation-delay:.3s}
.intro .i3{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;color:var(--blue);background:#E8F3FF;padding:6px 12px;border-radius:999px;animation-delay:.22s}
@keyframes introIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .intro > div > *{animation:none;opacity:1;transform:none} }

@media (max-width:900px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){
  .wrap{padding:0 20px}
  header{padding:28px 0 12px}
  .seg{display:flex}
  .seg button{flex:1;padding:0 4px;font-size:14px;white-space:nowrap}
  .seg button span{margin-left:3px;font-size:13px}
  .regions{gap:14px}
  .region{font-size:15px}
  .region span{font-size:13px;margin-left:3px}
  h1{font-size:24px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
  .btn{padding:0 14px}
  .name{font-size:15px}
  .desc{font-size:13px}
  .dim{align-items:flex-end;padding:0}
  .sheet{width:100%;border-radius:24px 24px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom)}
  .sheet .thumb{aspect-ratio:16/9}
}
</style>
</head>

<script>
// 인트로: 탭(브라우저 창)마다 처음 한 번만 보여요. 화면을 누르면 바로 넘어가요.
(function(){
  const el = document.getElementById('intro');
  let seen = false; try { seen = sessionStorage.getItem('introSeen') === '1'; sessionStorage.setItem('introSeen','1'); } catch(e){}
  if (seen) { el.remove(); return; }
  const hide = () => { el.classList.add('out'); setTimeout(() => el.remove(), 400); };

  el.addEventListener('click', () => { clearTimeout(timer); hide(); });
})();

<script>
const TYPES = {
  fav:  { name:'찜', title:'자주 가는 곳', ph:'찜한 곳 검색', pick:'찜한 곳 중에 여기 어때요?',
    cats:[['food','음식점'],['cafe','카페'],['cvs','편의점']], fav:true },
  food: { name:'음식점', title:'오늘 점심, 어디서 먹을까요?', ph:'메뉴, 가게 이름 검색', pick:'오늘은 여기 어때요?',
    cats:[['한식','한식'],['고기','고기·구이'],['국밥','국밥·탕'],['찌개','찌개'],['면','면·국수'],['일식','일식'],['중식','중식'],['양식','양식'],['아시안','아시안'],['분식','분식'],['샐러드','샐러드'],['닭','닭요리'],['해산물','해산물'],['샤브','샤브샤브']] },
  cafe: { name:'카페', title:'커피 한 잔, 어디로 갈까요?', ph:'카페, 브랜드, 메뉴 검색', pick:'여기서 한 잔 어때요?',
    cats:[['커피','커피'],['베이커리','베이커리'],['디저트','디저트'],['음료','음료']] },
  cvs:  { name:'편의점', title:'가까운 편의점을 찾아볼까요?', ph:'편의점 이름 검색', pick:'',
    cats:[['GS25','GS25'],['CU','CU'],['세븐일레븐','세븐일레븐'],['이마트24','이마트24'],['기타','기타']] },
};
const UPDATED = '11월 12일'; // 데이터 갱신하면 이 날짜와 인트로·푸터 날짜를 같이 바꿔 주세요
// 거리 탭: 한독빌딩에서 걸어서 몇 분 이내인지 (모든 가게가 15분 안쪽이라 15분은 '전체'와 같아요)
const RANGES = { '전체': p => true, '5분': p => p.hw <= 5, '10분': p => p.hw <= 10 };
const RLABEL = { '전체':'전체', '5분':'5분 이내', '10분':'10분 이내' };
const REGIONS = Object.keys(RANGES);
const inRegion = (p, r) => RANGES[r](p);
const isH = () => true; // 거리·정렬은 항상 한독빌딩 기준 // 전체·한독빌딩 탭은 한독빌딩 기준 거리
const SYN = {
  '국수':['국수','칼국수','막국수','냉면','쌀국수','우육면','수제비','소바','라멘','면요리','탄탄면','국시'],
  '면':['국수','칼국수','막국수','냉면','쌀국수','우육면','수제비','소바','라멘','면요리','탄탄면','국시','우동','짬뽕','짜장면'],
  '고기':['고기','구이','갈비','삼겹','한우','소고기','돼지','불백','제육','족발','보쌈','스테이크'],
  '햄버거':['버거'],'돈가스':['돈까스'],'초밥':['스시','초밥'],'짜장':['짜장면'],'회':['회','물회','막회','참치'],
  '카레':['카레','커리'],'커리':['카레','커리'],'베트남':['베트남','쌀국수'],'닭':['닭','치킨','삼계탕'],
  '빵':['빵','베이커리','베이글','도넛','와플'],'세븐':['세븐일레븐'],'gs':['gs25'],'씨유':['cu'],'스벅':['스타벅스'],
};

const norm = s => (s||'').toLowerCase().replace(/\s+/g,'');
const short = a => a.replace(/^서울\s+(강남구|서초구)\s+/,'').replace(/\s*\([^)]*\)\s*$/,'');
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

const LBL = {}; Object.values(TYPES).forEach(t => t.cats.forEach(([k,l]) => LBL[k]=l));
PLACES.forEach((p,i) => {
  p.o = i;
  p.kcl = (p.kc||'').replace(/,/g,'·');
  p.hay = norm([p.n, p.c, LBL[p.c], p.kc, (p.t||[]).join(' '), (p.kt||[]).join(' '), (p.sum||[]).join(' '), p.a, p.m].join(' '));
  p.base = p.n.replace(/\s+\S*(점|본점|직영점|호점)$/,'');
  p.branch = p.base !== p.n ? p.n.slice(p.base.length).trim() : '';
  p.walk = p.w ? `${p.s} ${p.w}분` : `${p.s} 인근`;
});
const COUNT = {}; PLACES.forEach(p => COUNT[p.ty]=(COUNT[p.ty]||0)+1);

// 찜(자주 가는 곳): 이 브라우저에만 저장돼요
let FAVS = new Set();
try { FAVS = new Set(JSON.parse(localStorage.getItem('sikdae-favs') || '[]')); } catch(e){}
const saveFavs = () => { try { localStorage.setItem('sikdae-favs', JSON.stringify([...FAVS])); } catch(e){} };
const isFav = p => FAVS.has(p.id);
const inType = p => TYPES[state.ty].fav ? isFav(p) : p.ty===state.ty;
const inCat = p => state.cat==='전체' || (TYPES[state.ty].fav ? p.ty===state.cat : p.c===state.cat);
const catOf = p => TYPES[state.ty].fav ? p.ty : p.c;
const heart = (p) => `<button type="button" class="fav ${isFav(p)?'on':''}" data-fav="${p.id}" aria-label="찜하기"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 20.3s-7.6-4.6-9.4-9.3C1.4 7.7 3.4 4.5 6.7 4.2c2-.2 3.9.8 5.3 2.6 1.4-1.8 3.3-2.8 5.3-2.6 3.3.3 5.3 3.5 4.1 6.8-1.8 4.7-9.4 9.3-9.4 9.3z"/></svg></button>`;
let toastT;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1600); }
function toggleFav(id){
  const p = BYID[id]; if (!p) return;
  if (FAVS.has(id)) { FAVS.delete(id); toast('찜을 해제했어요'); } else { FAVS.add(id); toast('찜했어요 · 상단 ‘찜’ 탭에서 모아 볼 수 있어요'); }
  saveFavs();
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => { b.classList.toggle('on', FAVS.has(id)); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); });
  renderCounts();
}

const state = { ty:'food', q:'', cat:'전체', region:'전체', sort:'d' };
try { localStorage.removeItem('sikdae'); } catch(e){} // 예전에 저장된 지역·정렬 기억 지우기 — 항상 전체 지역으로 시작
const fromHash = () => { const h = location.hash.slice(1); if (TYPES[h]) state.ty = h; };
fromHash();

function terms(){ return state.q.trim().split(/\s+/).filter(Boolean).map(t => { const n = norm(t); return SYN[n] || [n]; }); }
const hits = (p, ts) => ts.every(alts => alts.some(a => p.hay.includes(a)));

function filtered(){
  const ts = terms();
  // 검색어가 있으면 음식점·카페·편의점, 카테고리, 지역을 가리지 않고 전체에서 찾아요
  const all = ts.length > 0;
  const list = PLACES.filter(p => hits(p,ts) && (all ||
    (inType(p) && inCat(p) && inRegion(p, state.region))));
  if (state.sort === 'n') list.sort((a,b) => a.n.localeCompare(b.n, 'ko'));
  if (state.sort === 'd') list.sort(isH() ? (a,b) => a.hw - b.hw : (a,b) => (a.w||99) - (b.w||99));
  return list;
}

function hl(text){
  let out = esc(text);
  terms().flat().filter(Boolean).forEach(t => {
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    out = out.replace(re, m => `<mark>${m}</mark>`);
  });
  return out;
}
const img = (p, eager) => p.img
  ? `<img src="thumbs/${p.id}.webp" alt="" width="320" height="240" ${eager?'':'loading="lazy"'} decoding="async">`
  : `<div class="ph">${esc(p.base.slice(0,2))}</div>`;

function card(p, i){
  return `<div class="card" role="button" tabindex="0" data-id="${p.id}">
    ${heart(p)}
    <div class="thumb">${img(p, i < 8)}</div>
    <div class="info">
      <div class="name">${hl(p.base)}${p.branch?`<small>${esc(p.branch)}</small>`:''}</div>
      <div class="desc"><b>${hl(p.kcl)}</b><i></i>${isH() ? `한독빌딩 ${p.hw}분` : p.walk}</div>
    </div>
  </div>`;
}

let current = [];
function render(){
  const T = TYPES[state.ty];
  document.title = `멋사 식권대장 ver. vinnie · ${T.name}`;
  const ts = terms(), all = ts.length > 0, cnt = {}, rc = {};
  renderCounts();
  $('title').textContent = all ? `‘${state.q.trim()}’ 검색 결과` : T.title;
  $('sub').textContent = all ? '음식점·카페·편의점 전체에서 찾았어요'
    : T.fav ? `찜한 곳 ${FAVS.size}곳 · 이 브라우저에 저장돼요` : `식권대장 ${T.name} ${COUNT[state.ty]}곳 · ${UPDATED} 업데이트`;
  $('q').placeholder = T.ph;
  $('pick').hidden = !all && !T.pick;
  $('chips').hidden = all;
  $('regions').hidden = all;

  PLACES.forEach(p => {
    if ((!all && !inType(p)) || !hits(p,ts)) return;
    if (all || inCat(p)) { REGIONS.forEach(r => { if (inRegion(p, r)) rc[r]=(rc[r]||0)+1; }); }
    if (inRegion(p, state.region)) { const c = catOf(p); cnt[c]=(cnt[c]||0)+1; cnt['전체']=(cnt['전체']||0)+1; }
  });
  $('regions').innerHTML = REGIONS.map(r =>
    `<button class="region ${state.region===r?'on':''}" data-r="${r}">${RLABEL[r]}<span>${rc[r]||0}</span></button>`).join('');
  $('chips').innerHTML = [['전체','전체'], ...T.cats].map(([c,l]) =>
    `<button class="tab ${state.cat===c?'on':''} ${!cnt[c]?'zero':''}" data-c="${c}">${l}<span>${cnt[c]||0}</span></button>`).join('');

  current = filtered();
  $('clear').classList.toggle('on', !!state.q);
  $('count').textContent = (state.q || state.cat!=='전체' || state.region!=='전체')
    ? `${current.length}곳을 찾았어요` : `전체 ${current.length}곳`;
  [...$('sort').querySelectorAll('button')].forEach(b => b.classList.toggle('on', b.dataset.s===state.sort));
  $('grid').innerHTML = current.length ? current.map(card).join('')
    : (T.fav && !all && FAVS.size===0)
      ? `<div class="empty"><h3>아직 찜한 곳이 없어요</h3><p>카드 오른쪽 위 하트를 눌러 자주 가는 곳을 모아 보세요</p></div>`
      : `<div class="empty"><h3>검색 결과가 없어요</h3><p>다른 이름으로 검색해 보세요</p></div>`;
}

function renderCounts(){
  const ts = terms(), all = ts.length > 0, tc = {};
  PLACES.forEach(p => { if (hits(p,ts)) { tc[p.ty]=(tc[p.ty]||0)+1; if (isFav(p)) tc.fav=(tc.fav||0)+1; } });
  const base = { ...COUNT, fav: FAVS.size };
  $('types').innerHTML = ['food','cafe','cvs','fav'].map(k =>
    `<button class="${!all && state.ty===k?'on':''}" data-t="${k}">${TYPES[k].name}<span>${all ? (tc[k]||0) : (base[k]||0)}</span></button>`).join('');
  if (TYPES[state.ty].fav && !all) $('sub').textContent = `찜한 곳 ${FAVS.size}곳 · 이 브라우저에 저장돼요`;
}
function setType(t){
  if (!TYPES[t] || (t===state.ty && !state.q)) return;
  state.ty = t; state.cat = '전체'; state.q = ''; $('q').value = '';
  if (location.hash.slice(1) !== t) history.replaceState(null, '', '#'+t);
  render(); window.scrollTo({top:0});
}

let timer;
$('q').addEventListener('input', e => { state.q = e.target.value; clearTimeout(timer); timer = setTimeout(render, 90); });
$('clear').addEventListener('click', e => { e.preventDefault(); state.q=''; $('q').value=''; render(); $('q').focus(); });
$('types').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setType(b.dataset.t); });
$('chips').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; state.cat = b.dataset.c; render(); });
$('regions').addEventListener('click', e => { const b = e.target.closest('.region'); if (!b) return; state.region = b.dataset.r; render(); });
$('sort').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.sort = b.dataset.s; render(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TYPES[h]) setType(h); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape') { if ($('dim').classList.contains('on')) close(); else if (state.q) $('clear').click(); }
});
new IntersectionObserver(([en]) => $('bar').classList.toggle('stuck', en.intersectionRatio === 0)).observe(document.querySelector('header'));

const BYID = Object.fromEntries(PLACES.map(p => [p.id, p]));
function spotlight(){
  const pool = current.length ? current : PLACES.filter(inType);
  if (!pool.length) { toast('먼저 하트를 눌러 찜해 주세요'); return; }
  showDetail(pool[Math.floor(Math.random()*pool.length)], true);
}
function showDetail(p, isPick){
  const rec = p.sum && p.sum[1] && /추천/.test(p.sum[1]) ? p.sum[1].replace(/\s*추천$/,'') : '';
  $('spot').innerHTML = `
    ${heart(p)}
    <div class="thumb">${img(p, true)}</div>
    <div class="body">
      ${isPick ? `<div class="label">${TYPES[p.ty].pick || '여기 어때요?'}</div>` : ''}
      <h2>${esc(p.n)}</h2>
      <div class="desc">${esc(p.kcl)}${p.sum&&p.sum[0]?' · '+esc(p.sum[0]):''}</div>
      <dl class="kv">
        <dt>위치</dt><dd>${p.w ? `${p.s} ${p.ex}번 출구에서 도보 ${p.w}분 (${p.dist})` : `${p.s} 인근`}</dd>
        <dt>한독빌딩</dt><dd>도보 약 ${p.hw}분 (약 ${p.hm}m)</dd>
        <dt>주소</dt><dd>${esc(short(p.a))}</dd>
        ${rec?`<dt>추천</dt><dd>${esc(rec)}</dd>`:''}
        ${p.m?`<dt>메모</dt><dd>${esc(p.m)}</dd>`:''}
      </dl>
      <div class="acts">
        <button class="btn btn-weak" id="again">${isPick ? '다시 고르기' : '닫기'}</button>
        <a class="btn btn-primary" href="https://place.map.kakao.com/${p.id}" target="_blank" rel="noopener">카카오맵에서 보기</a>
      </div>
    </div>`;
  $('dim').classList.add('on');
  $('again').onclick = isPick ? spotlight : close;
}
function close(){ $('dim').classList.remove('on'); }
$('pick').addEventListener('click', spotlight);
$('grid').addEventListener('click', e => {
  const f = e.target.closest('.fav'); if (f) { toggleFav(f.dataset.fav); if (TYPES[state.ty].fav && !state.q) setTimeout(render, 250); return; }
  const c = e.target.closest('.card'); if (c) showDetail(BYID[c.dataset.id], false);
});
$('grid').addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.classList.contains('card')) { e.preventDefault(); showDetail(BYID[e.target.dataset.id], false); } });
$('spot').addEventListener('click', e => { const f = e.target.closest('.fav'); if (f) { toggleFav(f.dataset.fav); if (TYPES[state.ty].fav && !state.q) render(); } });
$('dim').addEventListener('click', e => { if (e.target === $('dim')) close(); });

render();
</script>
</body>
</html>
